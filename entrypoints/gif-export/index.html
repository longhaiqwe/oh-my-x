<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oh-my-x · GIF</title>
  <link rel="icon" href="/icons/32.png" />
</head>
<body>
  <main>
    <p class="brand">oh-my-x</p>
    <h1 id="title"></h1>
    <p id="note"></p>
    <p id="status" role="status" aria-live="polite"></p>
    <progress id="progress" max="100"></progress>
    <img id="preview" hidden />
    <div class="actions">
      <button id="cancel" type="button"></button>
      <button id="retry" type="button" hidden></button>
      <button id="copy" type="button" class="primary" hidden></button>
      <a id="save" class="secondary" hidden></a>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>
